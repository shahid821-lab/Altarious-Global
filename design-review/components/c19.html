<div class="demo c19">
  <div class="wrap">
    <div class="intro">
      <span class="eyebrow">Site search</span>
      <button type="button" class="trigger">
        <span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
        <span class="tt">Search verticals, products, articles…</span>
        <kbd class="kb"><span class="mod">Ctrl</span>K</kbd>
      </button>
      <p class="note">Press <b>Ctrl K</b> (or <b>⌘K</b>) anywhere on the page.</p>
    </div>

    <div class="scrim" hidden></div>

    <div class="palette" role="dialog" aria-modal="true" aria-label="Search Altarious Global" hidden>
      <div class="pin">
        <span class="ti" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
        <input type="text" class="q" placeholder="Type to search…" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="true" aria-controls="c19list" aria-autocomplete="list">
        <button type="button" class="esc">Esc</button>
      </div>
      <div class="results" id="c19list" role="listbox" aria-label="Results"></div>
      <div class="pfoot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span class="cc"></span>
      </div>
    </div>
    <p class="picked" aria-live="polite"></p>
  </div>

  <style>
    .c19{font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--fg-2,#3D4757)}
    .c19 *{box-sizing:border-box}
    .c19 .wrap{position:relative;min-height:250px;display:flex;flex-direction:column}
    .c19 .intro{display:flex;flex-direction:column;gap:9px;align-items:flex-start;padding:8px 0}
    .c19 .eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3,#7A8798)}
    .c19 .trigger{width:100%;display:flex;align-items:center;gap:9px;font:inherit;font-size:13px;padding:10px 12px;border-radius:11px;border:1px solid var(--line,#E2E6EC);background:var(--panel,#fff);color:var(--fg-3,#7A8798);cursor:pointer;transition:.18s;text-align:left}
    .c19 .trigger:hover{border-color:var(--fg-3,#7A8798)}
    .c19 .trigger:focus-visible,.c19 .esc:focus-visible{outline:2px solid var(--signal,#E8A33D);outline-offset:2px}
    .c19 .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .c19 .ti svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;display:block}
    .c19 kbd,.c19 .kb{font-family:"IBM Plex Mono",monospace;font-size:9.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--line,#E2E6EC);background:var(--panel-2,#F3F5F8);color:var(--fg-3,#7A8798);white-space:nowrap}
    .c19 .note{margin:0;font-size:11px;color:var(--fg-3,#7A8798)}
    .c19 .note b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--fg-2,#3D4757)}
    .c19 .scrim{position:absolute;inset:0;background:rgba(10,16,24,.42);border-radius:12px;z-index:4;animation:c19f .16s ease both}
    .c19 .palette{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;flex-direction:column;border:1px solid var(--line,#E2E6EC);border-radius:12px;background:var(--panel,#fff);box-shadow:0 20px 44px -22px rgba(10,16,24,.6);overflow:hidden;max-height:100%;animation:c19p .18s cubic-bezier(.2,.7,.2,1) both}
    @keyframes c19f{from{opacity:0}}
    @keyframes c19p{from{opacity:0;transform:translateY(-8px) scale(.985)}}
    .c19 .pin{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--line,#E2E6EC);color:var(--fg-3,#7A8798)}
    .c19 .q{flex:1;min-width:0;font:inherit;font-size:14px;border:0;background:none;color:var(--fg,#141A22);outline:none}
    .c19 .esc{font:inherit;font-family:"IBM Plex Mono",monospace;font-size:9.5px;padding:3px 7px;border-radius:5px;border:1px solid var(--line,#E2E6EC);background:var(--panel-2,#F3F5F8);color:var(--fg-3,#7A8798);cursor:pointer}
    .c19 .results{overflow-y:auto;max-height:168px;padding:6px}
    .c19 .grp{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3,#7A8798);padding:8px 8px 4px}
    .c19 .row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--fg-2,#3D4757)}
    .c19 .row[aria-selected=true]{background:var(--panel-2,#F3F5F8);color:var(--fg,#141A22)}
    .c19 .row[aria-selected=true] .go{opacity:1}
    .c19 .row .ic{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--panel-2,#F3F5F8);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--fg-3,#7A8798)}
    .c19 .row[aria-selected=true] .ic{background:var(--signal,#E8A33D);color:#1b1206}
    .c19 .row .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .c19 .row mark{background:none;color:var(--live,#1FA9A0);font-weight:600}
    .c19 .row .go{opacity:0;font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--fg-3,#7A8798)}
    .c19 .empty{padding:22px 10px;text-align:center;font-size:12px;color:var(--fg-3,#7A8798)}
    .c19 .pfoot{display:flex;gap:12px;align-items:center;padding:7px 12px;border-top:1px solid var(--line,#E2E6EC);font-size:10px;color:var(--fg-3,#7A8798);flex-wrap:wrap}
    .c19 .pfoot kbd{margin-right:3px}
    .c19 .cc{margin-left:auto;font-family:"IBM Plex Mono",monospace}
    .c19 .picked{margin:auto 0 0;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--live,#1FA9A0);min-height:16px}
    @media (prefers-reduced-motion:reduce){.c19 *{animation:none!important;transition:none!important}}
  </style>

  <script>
  (function(){
    var r=document.currentScript.closest('.c19');
    var trg=r.querySelector('.trigger'),pal=r.querySelector('.palette'),scrim=r.querySelector('.scrim');
    var q=r.querySelector('.q'),list=r.querySelector('.results'),cc=r.querySelector('.cc'),picked=r.querySelector('.picked');
    var mac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
    if(mac)r.querySelector('.mod').textContent='⌘';

    var DATA=[
      ['Vertical','Insurance','V'],['Vertical','Home Services','V'],['Vertical','Web Leads','V'],
      ['Sub-vertical','Auto Insurance','S'],['Sub-vertical','Medicare','S'],['Sub-vertical','Final Expense','S'],
      ['Sub-vertical','Pest Control','S'],['Sub-vertical','HVAC','S'],['Sub-vertical','Roofing','S'],
      ['Sub-vertical','Personal Loans','S'],['Sub-vertical','Debt Relief','S'],['Sub-vertical','Legal','S'],
      ['Product','Inbound Calls','P'],['Product','Live Transfers','P'],['Product','Web Leads','P'],
      ['Product','Pay-per-call pricing','P'],['Product','Ping-tree distribution','P'],
      ['Article','Why Medicare inbound peaks in the AEP window','A'],
      ['Article','Building a warm bridge agents don’t hang up on','A'],
      ['Article','HVAC demand curves: selling heat in July','A'],
      ['Article','One-to-one consent after the TCPA update','A'],
      ['Article','Speed-to-lead: the first 60 seconds','A'],
      ['Article','Qualifying mass-tort calls without the churn','A'],
      ['Article','What ASR scoring actually catches','A'],
      ['Page','About Altarious Global','#'],['Page','Contact the buyer desk','#'],['Page','Compliance & TCPA policy','#']
    ].map(function(d){return {g:d[0],t:d[1],i:d[2]};});

    var rows=[],sel=0;
    function fuzzy(t,s){
      if(!s)return {score:0,marks:null};
      var lt=t.toLowerCase(),ls=s.toLowerCase();
      var idx=lt.indexOf(ls);
      if(idx>-1)return {score:1000-idx*2+(idx===0?200:0),marks:[[idx,idx+ls.length]]};
      var i=0,m=[],last=-2,sc=0;
      for(var j=0;j<lt.length&&i<ls.length;j++){
        if(lt[j]===ls[i]){m.push([j,j+1]);sc+=(j===last+1?12:4)+(j===0||/[\s\-:]/.test(lt[j-1]||'')?6:0);last=j;i++;}
      }
      return i===ls.length?{score:sc,marks:m}:null;
    }
    function hi(t,marks){
      if(!marks)return esc(t);
      var out='',p=0;
      marks.forEach(function(m){out+=esc(t.slice(p,m[0]))+'<mark>'+esc(t.slice(m[0],m[1]))+'</mark>';p=m[1];});
      return out+esc(t.slice(p));
    }
    function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

    function render(){
      var s=q.value.trim();
      var hits=[];
      DATA.forEach(function(d){
        var m=fuzzy(d.t,s);
        if(m)hits.push({d:d,score:m.score,marks:m.marks});
        else if(s&&fuzzy(d.g,s))hits.push({d:d,score:1,marks:null});
      });
      if(s)hits.sort(function(a,b){return b.score-a.score;});
      hits=hits.slice(0,40);
      list.innerHTML='';rows=[];
      if(!hits.length){
        list.innerHTML='<p class="empty">No matches for &ldquo;'+esc(s)+'&rdquo;</p>';
        cc.textContent='0 results';return;
      }
      var order=['Vertical','Sub-vertical','Product','Article','Page'],seen={};
      hits.forEach(function(h){(seen[h.d.g]=seen[h.d.g]||[]).push(h);});
      order.forEach(function(g){
        if(!seen[g])return;
        var head=document.createElement('div');head.className='grp';head.textContent=g;head.setAttribute('role','presentation');
        list.appendChild(head);
        seen[g].forEach(function(h){
          var el=document.createElement('div');
          el.className='row';el.setAttribute('role','option');el.setAttribute('aria-selected','false');
          el.innerHTML='<span class="ic">'+h.d.i+'</span><span class="tx">'+hi(h.d.t,h.marks)+'</span><span class="go">Open ↵</span>';
          el.addEventListener('mousemove',function(){mark(rows.indexOf(el));});
          el.addEventListener('click',function(){choose(el);});
          el.dataset.t=h.d.t;el.dataset.g=g;
          list.appendChild(el);rows.push(el);
        });
      });
      cc.textContent=rows.length+' result'+(rows.length===1?'':'s');
      mark(0);
    }
    function mark(n){
      if(!rows.length)return;
      sel=Math.max(0,Math.min(rows.length-1,n));
      rows.forEach(function(el,i){el.setAttribute('aria-selected',i===sel);});
      var el=rows[sel];
      if(el.id==='')el.id='c19o'+sel;
      q.setAttribute('aria-activedescendant',el.id);
      var er=el.getBoundingClientRect(),lr=list.getBoundingClientRect();
      if(er.top<lr.top)list.scrollTop-=lr.top-er.top;
      else if(er.bottom>lr.bottom)list.scrollTop+=er.bottom-lr.bottom;
    }
    function choose(el){
      picked.textContent='→ Opened '+el.dataset.g.toLowerCase()+': '+el.dataset.t;
      close();
    }
    function open(){
      scrim.hidden=false;pal.hidden=false;q.value='';render();
      requestAnimationFrame(function(){q.focus();});
    }
    function close(){scrim.hidden=true;pal.hidden=true;trg.focus();}

    trg.addEventListener('click',open);
    scrim.addEventListener('click',close);
    r.querySelector('.esc').addEventListener('click',close);
    q.addEventListener('input',render);
    q.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'){e.preventDefault();mark(sel+1);}
      else if(e.key==='ArrowUp'){e.preventDefault();mark(sel-1);}
      else if(e.key==='Home'){e.preventDefault();mark(0);}
      else if(e.key==='End'){e.preventDefault();mark(rows.length-1);}
      else if(e.key==='Enter'){e.preventDefault();if(rows[sel])choose(rows[sel]);}
      else if(e.key==='Escape'){e.preventDefault();close();}
    });
    document.addEventListener('keydown',function(e){
      if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){
        if(!r.isConnected)return;
        e.preventDefault();pal.hidden?open():close();
      }
    });
  })();
  </script>
</div>
