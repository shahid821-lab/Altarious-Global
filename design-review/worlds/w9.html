<section class="stage w9">
  <div class="frame">
    <div class="rules" aria-hidden="true"></div>

    <header class="nav">
      <span class="mark">ALTARIOUS<i>GLOBAL</i></span>
      <nav class="links">
        <span>Verticals</span><span>Products</span><span>Coverage</span><span class="cta">Connect</span>
      </nav>
    </header>

    <div class="head">
      <p class="kicker">SYS/LAYOUT ENGINE</p>
      <h1>Acquire high-intent customers.</h1>
    </div>

    <div class="switch" role="tablist" aria-label="Layout mode">
      <button type="button" class="on" data-mode="0" role="tab">Overview</button>
      <button type="button" data-mode="1" role="tab">By vertical</button>
      <button type="button" data-mode="2" role="tab">By product</button>
    </div>

    <div class="grid" id="w9grid"></div>

    <footer class="foot">
      <span class="mono">GRID 12 &times; 6</span>
      <span class="mono coord">RECONFIG <i id="w9cnt">A4 → B7</i></span>
    </footer>
  </div>

<style>
.w9{
  --bg:#0e0f11; --ink:#f2f1ee; --dim:#8b8d90; --line:rgba(242,241,238,.13);
  --line2:rgba(242,241,238,.07); --acc:#ff5a1f; --tile:#17181b;
  width:100%; max-width:640px; height:420px; position:relative; overflow:hidden;
  border-radius:10px; background:var(--bg); color:var(--ink);
  font-family:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  contain:content; isolation:isolate;
}
.w9 *{box-sizing:border-box;margin:0;padding:0}
.w9 .frame{position:absolute;inset:0;padding:12px 14px;display:flex;flex-direction:column}
.w9 .rules{
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(to right,var(--line2) 0 1px,transparent 1px calc(100%/12)),
    linear-gradient(to bottom,transparent,transparent);
  background-size:100% 100%;
  mask-image:linear-gradient(to bottom,transparent 0,#000 70px,#000 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 70px,#000 88%,transparent 100%);
}
.w9 .nav{display:flex;align-items:center;justify-content:space-between;
  padding-bottom:9px;border-bottom:1px solid var(--line);position:relative;z-index:2}
.w9 .mark{font-size:10px;letter-spacing:.16em;font-weight:700}
.w9 .mark i{font-style:normal;color:var(--dim);margin-left:.35em;font-weight:400}
.w9 .links{display:flex;gap:12px;font-size:9px;letter-spacing:.1em;color:var(--dim);
  font-family:"IBM Plex Mono",ui-monospace,monospace;text-transform:uppercase;align-items:center}
.w9 .links .cta{color:var(--bg);background:var(--acc);padding:3px 7px;border-radius:3px;font-weight:600}
.w9 .head{padding:11px 0 8px;position:relative;z-index:2}
.w9 .kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;
  letter-spacing:.22em;color:var(--acc);margin-bottom:5px}
.w9 h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;
  font-size:clamp(19px,4.6vw,29px);line-height:1.02;letter-spacing:-.01em}
.w9 .switch{display:flex;gap:5px;margin-bottom:8px;position:relative;z-index:2;flex-wrap:wrap}
.w9 .switch button{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:8px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:transparent;
  border:1px solid var(--line);border-radius:99px;padding:3.5px 9px;cursor:pointer;
  transition:color .25s,border-color .25s,background .25s}
.w9 .switch button.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.w9 .grid{position:relative;flex:1;min-height:0;z-index:1}
.w9 .t{
  position:absolute;background:var(--tile);border:1px solid var(--line);border-radius:5px;
  padding:6px 7px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  will-change:transform;backface-visibility:hidden;
}
.w9 .t .lb{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:7px;
  letter-spacing:.12em;color:var(--dim);display:flex;justify-content:space-between;gap:4px}
.w9 .t .nm{font-size:10.5px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.w9 .t .sub{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:7.5px;color:var(--dim);margin-top:2px}
.w9 .t.k-metric{background:linear-gradient(160deg,#1b1c20,#141518)}
.w9 .t.k-metric .nm{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;letter-spacing:-.03em}
.w9 .t.k-product{border-color:rgba(255,90,31,.42);background:linear-gradient(150deg,rgba(255,90,31,.13),var(--tile) 62%)}
.w9 .t.k-product .lb{color:var(--acc)}
.w9 .t.k-article .nm{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:12px}
.w9 .t .bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.w9 .t .bar i{display:block;height:100%;background:var(--acc);transform-origin:left;
  transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.w9 .t .dot{width:4px;height:4px;border-radius:50%;background:var(--acc);flex:0 0 auto}
.w9 .foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);
  padding-top:7px;margin-top:8px;position:relative;z-index:2}
.w9 .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:7.5px;
  letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.w9 .mono i{font-style:normal;color:var(--acc)}
@media (max-width:380px){
  .w9 .links span:not(.cta){display:none}
  .w9 .t .sub{display:none}
}
@media (prefers-reduced-motion:reduce){
  .w9 .t{transition:none!important}
}
</style>

<script>
(function(){
  var root=document.currentScript.closest('.w9'); if(!root) return;
  var grid=root.querySelector('#w9grid'), btns=[].slice.call(root.querySelectorAll('.switch button'));
  var readout=root.querySelector('#w9cnt');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLS=12, ROWS=6, GAP=5;

  // x,y,w,h in grid units per layout
  var DATA=[
    {k:'product',lb:'PRD',nm:'Inbound Calls',sub:'live · 24/7',v:[[0,0,5,2],[7,0,5,2],[0,0,6,2]]},
    {k:'product',lb:'PRD',nm:'Live Transfers',sub:'warm handoff',v:[[5,0,4,2],[7,2,5,2],[6,0,6,2]]},
    {k:'product',lb:'PRD',nm:'Web Leads',sub:'form + TCPA',v:[[9,0,3,2],[7,4,5,2],[0,2,6,2]]},
    {k:'vert',lb:'VRT',nm:'Insurance',sub:'Auto · Medicare',v:[[0,2,4,2],[0,0,7,2],[0,4,4,2]]},
    {k:'vert',lb:'VRT',nm:'Home Services',sub:'Pest · HVAC',v:[[4,2,4,2],[0,2,7,2],[4,4,4,2]]},
    {k:'vert',lb:'VRT',nm:'Web Leads',sub:'Loans · Legal',v:[[8,2,4,2],[0,4,7,2],[8,4,4,2]]},
    {k:'metric',lb:'CR',nm:'38.4%',sub:'transfer accept',v:[[0,4,3,2],[7,0,2,2],[6,2,3,2]]},
    {k:'metric',lb:'AHT',nm:'2:14',sub:'avg handle',v:[[3,4,3,2],[9,0,3,2],[9,2,3,2]]},
    {k:'article',lb:'ART',nm:'Intent scoring for Medicare AEP',sub:'field note',v:[[6,4,6,2],[7,2,5,2],[0,4,12,2]]}
  ];
  var L=['Overview','By vertical','By product'];
  var A='ABCDEFGHIJKL';
  var mode=0, tiles=[];

  DATA.forEach(function(d,i){
    var el=document.createElement('div');
    el.className='t k-'+d.k;
    el.innerHTML='<div class="lb"><span class="c"></span><span>'+d.lb+'</span></div>'+
      '<div><div class="nm">'+d.nm+'</div><div class="sub">'+d.sub+'</div>'+
      (d.k==='metric'?'<div class="bar"><i style="transform:scaleX(.2)"></i></div>':'')+'</div>';
    grid.appendChild(el);
    tiles.push({el:el,d:d,x:0,y:0,i:i});
  });

  function place(animate){
    var W=grid.clientWidth, H=grid.clientHeight;
    if(!W||!H) return;
    var cw=(W-GAP*(COLS-1))/COLS, ch=(H-GAP*(ROWS-1))/ROWS;
    tiles.forEach(function(t,i){
      var v=t.d.v[mode], first=t.el.getBoundingClientRect();
      var x=Math.round(v[0]*(cw+GAP)), y=Math.round(v[1]*(ch+GAP));
      var w=Math.round(v[2]*cw+(v[2]-1)*GAP), h=Math.round(v[3]*ch+(v[3]-1)*GAP);
      t.el.style.width=w+'px'; t.el.style.height=h+'px';
      t.el.style.transform='translate3d('+x+'px,'+y+'px,0)';
      t.el.querySelector('.c').textContent=A[v[0]]+(v[1]+1);
      var bar=t.el.querySelector('.bar i');
      if(bar) bar.style.transform='scaleX('+(0.32+((i*7+mode*3)%6)/9)+')';
      if(animate&&!reduce){
        var dx=first.left-grid.getBoundingClientRect().left-x;
        var dy=first.top-grid.getBoundingClientRect().top-y;
        if(Math.abs(dx)>.5||Math.abs(dy)>.5){
          t.el.animate(
            [{transform:'translate3d('+(x+dx)+'px,'+(y+dy)+'px,0)'},
             {transform:'translate3d('+x+'px,'+y+'px,0)'}],
            {duration:760,delay:i*38,easing:'cubic-bezier(.18,.9,.24,1)',composite:'replace'}
          );
        }
      }
    });
    readout.textContent=L[mode].toUpperCase()+' · '+A[tiles[0].d.v[mode][0]]+(tiles[0].d.v[mode][1]+1);
  }

  function set(m,animate){
    mode=m;
    btns.forEach(function(b,j){b.classList.toggle('on',j===m)});
    place(animate);
  }
  btns.forEach(function(b){b.addEventListener('click',function(){set(+b.dataset.mode,true)})});

  var timer=null, running=false;
  function tick(){ set((mode+1)%3,true); }
  function start(){ if(running||reduce)return; running=true; timer=setInterval(tick,3400); }
  function stop(){ running=false; clearInterval(timer); }

  requestAnimationFrame(function(){ set(0,false); });
  var ro=new ResizeObserver(function(){ place(false) }); ro.observe(grid);
  new IntersectionObserver(function(e){ e[0].isIntersecting?start():stop() },{threshold:.2}).observe(root);
})();
</script>
</section>
