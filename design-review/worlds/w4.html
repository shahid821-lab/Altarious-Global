<section class="stage w4">
  <div class="w4-rail">
    <div class="w4-rail-lab">ELAPSED</div>
    <div class="w4-rail-ms" data-ms>0000</div>
    <div class="w4-rail-u">MS</div>
    <canvas class="w4-tick" data-tick aria-hidden="true"></canvas>
    <div class="w4-rail-foot">P95<br><b data-p95>41.2</b>s</div>
  </div>

  <div class="w4-main">
    <div class="w4-nav">
      <span class="w4-logo">ALTARIOUS<span>&nbsp;GLOBAL</span></span>
      <nav><a>Insurance</a><a>Home Services</a><a>Web Leads</a></nav>
      <span class="w4-live"><i data-ring></i><span data-state>IDLE</span></span>
    </div>

    <div class="w4-hero">
      <div class="w4-eyebrow"><span data-hs>—</span></div>
      <h1 class="w4-h1"><span data-type></span><i class="w4-cur"></i></h1>
      <p class="w4-p"><span data-type2></span></p>
      <div class="w4-chips" data-chips>
        <span>Auto Insurance</span><span>Medicare</span><span>Pest Control</span><span>HVAC</span><span>Personal Loans</span><span>Legal</span>
      </div>
      <div class="w4-ledger" data-ledger></div>
    </div>

    <div class="w4-metrics">
      <div class="w4-m"><b data-n="43" data-d="0">0</b><u>s median<br>to delivery</u></div>
      <div class="w4-m"><b data-n="99.4" data-d="1">0</b><u>% transfer<br>uptime</u></div>
      <div class="w4-m"><b data-n="340" data-d="0">0</b><u>ms landing<br>page paint</u></div>
    </div>

    <div class="w4-tl">
      <div class="w4-tl-head"><span>DELIVERY TRACE · LIVE TRANSFER · TX</span><span data-play>00.000</span></div>
      <div class="w4-track">
        <div class="w4-fill" data-fill></div>
        <div class="w4-head-pin" data-pin></div>
        <div class="w4-marks" data-marks></div>
      </div>
      <div class="w4-labels" data-labels></div>
    </div>
  </div>

<style>
.w4{
  --bg:#0b0b0c; --sur:#111113; --line:#242427; --ink:#f4f4f2; --dim:#83838a; --dim2:#5a5a60;
  --hot:#ff3d15;
  height:420px; position:relative; overflow:hidden; border-radius:10px;
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  display:flex; contain:layout paint style; container-type:inline-size; isolation:isolate;
}
.w4 *{box-sizing:border-box;}

.w4 .w4-rail{
  flex:0 0 68px; border-right:1px solid var(--line); background:linear-gradient(180deg,#0e0e10,#0a0a0b);
  display:flex; flex-direction:column; align-items:center; padding:12px 6px 10px; gap:2px; position:relative;
}
.w4 .w4-rail-lab{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:7px; letter-spacing:.24em; color:var(--dim2);}
.w4 .w4-rail-ms{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;
  font-size:20px; font-weight:600; letter-spacing:-.02em; color:var(--hot); line-height:1.1; margin-top:4px;
}
.w4 .w4-rail-u{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:7px; letter-spacing:.3em; color:var(--dim2);}
.w4 .w4-tick{flex:1 1 auto; width:100%; min-height:0; display:block; margin:8px 0;}
.w4 .w4-rail-foot{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:7px; letter-spacing:.18em; color:var(--dim2); text-align:center; line-height:1.6;}
.w4 .w4-rail-foot b{font-size:12px; color:var(--ink); letter-spacing:0;}

.w4 .w4-main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; padding:12px 14px 10px;}

.w4 .w4-nav{display:flex; align-items:center; gap:10px; padding-bottom:9px; border-bottom:1px solid var(--line);}
.w4 .w4-logo{font-family:"Archivo",ui-sans-serif,sans-serif; font-weight:800; font-size:10px; letter-spacing:.14em; white-space:nowrap;}
.w4 .w4-logo span{color:var(--dim2); font-weight:500;}
.w4 .w4-nav nav{display:flex; gap:12px; margin-left:auto;}
.w4 .w4-nav a{font-size:9px; letter-spacing:.1em; color:var(--dim); text-transform:uppercase;}
.w4 .w4-live{display:flex; align-items:center; gap:5px; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:8px; letter-spacing:.16em; color:var(--dim); padding-left:10px; border-left:1px solid var(--line);}
.w4 .w4-live i{width:6px;height:6px;border-radius:50%;background:#2c2c30; display:block;}
.w4 .w4-live i.on{background:var(--hot); box-shadow:0 0 0 0 rgba(255,61,21,.55); animation:w4ring 1.1s infinite;}
@keyframes w4ring{to{box-shadow:0 0 0 7px rgba(255,61,21,0);}}

.w4 .w4-hero{padding:12px 0 8px;}
.w4 .w4-eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:7.5px; letter-spacing:.26em; color:var(--hot); height:11px;}
.w4 .w4-h1{
  margin:5px 0 0; font-family:"Archivo",ui-sans-serif,sans-serif; font-weight:700;
  font-size:clamp(20px,5.2vw,34px); line-height:1.02; letter-spacing:-.03em; min-height:38px;
}
.w4 .w4-cur{display:inline-block; width:2px; height:.82em; background:var(--hot); vertical-align:-.06em; margin-left:2px; animation:w4blink 1s steps(1,end) infinite;}
@keyframes w4blink{50%{opacity:0}}
.w4 .w4-p{margin:7px 0 0; font-size:10.5px; line-height:1.5; color:var(--dim); max-width:44ch; min-height:16px;}
.w4 .w4-chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:9px;}
.w4 .w4-chips span{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:7.5px; letter-spacing:.1em; color:var(--dim);
  border:1px solid var(--line); border-radius:99px; padding:3px 7px; opacity:0; transform:translateY(4px);
  transition:opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1), color .3s, border-color .3s;
}
.w4 .w4-chips span.in{opacity:1; transform:none;}
.w4 .w4-chips span.hot{color:var(--ink); border-color:var(--hot);}

.w4 .w4-ledger{margin-top:11px; display:flex; flex-direction:column; gap:3px;}
.w4 .w4-ledger div{
  display:grid; grid-template-columns:52px 1fr auto; gap:8px; align-items:baseline;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:8px; letter-spacing:.06em;
  color:var(--dim2); border-bottom:1px solid rgba(36,36,39,.75); padding-bottom:3px;
  opacity:0; transform:translateY(3px); transition:opacity .3s ease, transform .3s cubic-bezier(.2,.8,.2,1);
}
.w4 .w4-ledger div.in{opacity:1; transform:none;}
.w4 .w4-ledger div span:first-child{color:var(--hot); font-variant-numeric:tabular-nums;}
.w4 .w4-ledger div span:nth-child(2){color:var(--dim);}
.w4 .w4-ledger div span:last-child{font-variant-numeric:tabular-nums;}
.w4 .w4-metrics{display:flex; gap:14px; margin-top:auto; padding:9px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
.w4 .w4-m{display:flex; align-items:baseline; gap:5px;}
.w4 .w4-m b{
  font-family:"Archivo",ui-sans-serif,sans-serif; font-weight:700; font-size:22px; letter-spacing:-.045em;
  font-variant-numeric:tabular-nums; line-height:1;
}
.w4 .w4-m u{text-decoration:none; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:6.5px; letter-spacing:.14em; color:var(--dim2); line-height:1.5;}

.w4 .w4-tl{padding-top:9px;}
.w4 .w4-tl-head{display:flex; justify-content:space-between; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:7px; letter-spacing:.2em; color:var(--dim2); margin-bottom:7px;}
.w4 .w4-tl-head span:last-child{color:var(--hot); font-variant-numeric:tabular-nums; letter-spacing:.06em;}
.w4 .w4-track{position:relative; height:3px; background:#1b1b1e; border-radius:2px;}
.w4 .w4-fill{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--hot); border-radius:2px;}
.w4 .w4-head-pin{position:absolute; top:-4px; width:1px; height:11px; background:var(--ink); left:0;}
.w4 .w4-marks{position:absolute; inset:0;}
.w4 .w4-marks i{
  position:absolute; top:-2.5px; width:7px; height:7px; margin-left:-3.5px; border-radius:50%;
  background:#0b0b0c; border:1px solid #33333a; transform:scale(.7); transition:transform .22s cubic-bezier(.2,1.5,.4,1), border-color .2s, background .2s;
}
.w4 .w4-marks i.hit{background:var(--hot); border-color:var(--hot); transform:scale(1);}
.w4 .w4-labels{position:relative; height:26px; margin-top:6px;}
.w4 .w4-labels span{
  position:absolute; top:0; transform:translateX(-50%); text-align:center; white-space:nowrap;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:6.5px; letter-spacing:.1em; color:var(--dim2);
  line-height:1.7; transition:color .25s, opacity .25s; opacity:.55;
}
.w4 .w4-labels span b{display:block; font-size:8px; color:inherit; font-weight:600;}
.w4 .w4-labels span.hit{opacity:1; color:var(--ink);}
.w4 .w4-labels span.hit b{color:var(--hot);}
.w4 .w4-labels span:first-child{transform:translateX(0); text-align:left;}
.w4 .w4-labels span:last-child{transform:translateX(-100%); text-align:right;}

@media (max-width:430px){
  .w4 .w4-rail{flex:0 0 50px;} .w4 .w4-rail-ms{font-size:15px;}
  .w4 .w4-nav nav{display:none;}
  .w4 .w4-metrics{gap:8px;} .w4 .w4-m b{font-size:16px;}
  .w4 .w4-chips span:nth-child(n+5){display:none;}
  .w4 .w4-labels span{font-size:5.5px;}
}
@container (max-width:430px){
  .w4 .w4-rail{flex:0 0 50px;} .w4 .w4-rail-ms{font-size:15px;}
  .w4 .w4-nav nav{display:none;}
  .w4 .w4-metrics{gap:8px;} .w4 .w4-m b{font-size:16px;} .w4 .w4-m u{font-size:5.5px;}
  .w4 .w4-h1{font-size:20px;} .w4 .w4-p{font-size:9px;}
  .w4 .w4-chips span:nth-child(n+5){display:none;}
  .w4 .w4-ledger div:nth-child(n+3){display:none;}
  .w4 .w4-ledger div{grid-template-columns:40px 1fr; font-size:7px;}
  .w4 .w4-ledger div span:last-child{display:none;}
  .w4 .w4-labels span{font-size:5.5px;}
}
@media (prefers-reduced-motion: reduce){
  .w4 .w4-cur{animation:none;} .w4 .w4-live i.on{animation:none;}
}
</style>

<script>
(function(){
  var cs=document.currentScript, root=cs?cs.closest('.w4'):null;
  if(!root){ var all=document.querySelectorAll('section.stage.w4'); for(var n=all.length-1;n>=0;n--){ if(!all[n].dataset.on){root=all[n];break;} } }
  if(!root||root.dataset.on)return; root.dataset.on='1';
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $=function(s){return root.querySelector(s);};

  var H="Acquire high-intent customers.";
  var P="Inbound calls, live transfers and web leads — routed, qualified and delivered inside a single connected minute.";
  var STEPS=[
    {t:0,     p:0,   l:"CLICK",     s:"0ms"},
    {t:340,   p:20,  l:"LANDING",   s:"340ms"},
    {t:12000, p:50,  l:"CALL INIT", s:"12s"},
    {t:41000, p:79,  l:"QUALIFIED", s:"41s"},
    {t:43000, p:100, l:"DELIVERED", s:"43s"}
  ];
  var SPAN=43000;
  var LEDGER=[
    ["12.4s","Auto Insurance · inbound call · TX","MATCHED"],
    ["41.0s","Medicare · live transfer · FL","QUALIFIED"],
    ["43.0s","HVAC · web lead · AZ","DELIVERED"]
  ];
  function tAt(x){
    for(var i=0;i<STEPS.length-1;i++){
      if(x<=STEPS[i+1].p){var f=(x-STEPS[i].p)/(STEPS[i+1].p-STEPS[i].p||1);
        return STEPS[i].t+(STEPS[i+1].t-STEPS[i].t)*Math.max(0,Math.min(1,f));}
    }
    return SPAN;
  }

  /* timeline furniture */
  var marks=$('[data-marks]'), labels=$('[data-labels]'), mEls=[], lEls=[];
  STEPS.forEach(function(s){
    var p=s.p;
    var i=document.createElement('i'); i.style.left=p+'%'; marks.appendChild(i); mEls.push(i);
    var sp=document.createElement('span'); sp.style.left=p+'%';
    sp.innerHTML='<b>'+s.s+'</b>'+s.l; labels.appendChild(sp); lEls.push(sp);
  });

  var fill=$('[data-fill]'), pin=$('[data-pin]'), play=$('[data-play]');
  var msEl=$('[data-ms]'), ring=$('[data-ring]'), stateEl=$('[data-state]'), hs=$('[data-hs]');
  var t1=$('[data-type]'), t2=$('[data-type2]');
  var chips=[].slice.call(root.querySelectorAll('[data-chips] span'));
  var ledHost=root.querySelector('[data-ledger]'), leds=LEDGER.map(function(r){
    var d=document.createElement('div');
    d.innerHTML='<span>'+r[0]+'</span><span>'+r[1]+'</span><span>'+r[2]+'</span>';
    ledHost.appendChild(d); return d;
  });

  /* ms tick canvas */
  var cv=$('[data-tick]'), ctx=cv.getContext('2d'), cw=0,ch=0,dpr=1;
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);
    cw=cv.clientWidth; ch=cv.clientHeight;
    cv.width=Math.max(1,cw*dpr); cv.height=Math.max(1,ch*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function drawTicks(off){
    if(!cw||!ch)return;
    ctx.clearRect(0,0,cw,ch);
    var gap=9, n=Math.ceil(ch/gap)+2;
    for(var i=0;i<n;i++){
      var y=((i*gap - off%gap)+gap)%(ch+gap);
      var major=(Math.floor((i*gap-off)/gap)%5===0);
      ctx.fillStyle=major?'rgba(244,244,242,.5)':'rgba(131,131,138,.22)';
      ctx.fillRect(cw/2-(major?9:4), y, major?18:8, 1);
    }
    ctx.fillStyle='#ff3d15';
    ctx.fillRect(cw/2-13, ch/2, 26, 1.5);
  }

  /* metrics count-up */
  var mets=[].slice.call(root.querySelectorAll('.w4-m b'));
  function metric(p){
    mets.forEach(function(b){
      var n=parseFloat(b.dataset.n), d=+b.dataset.d;
      var e=1-Math.pow(1-p,3);
      b.textContent=(n*e).toFixed(d);
    });
  }
  metric(0);

  /* state machine */
  var t0=performance.now(), phase=0, typed1=0, typed2=0, lastType=0;
  function setState(txt,on){ stateEl.textContent=txt; ring.classList.toggle('on',!!on); }

  function finish(){
    t1.textContent=H; t2.textContent=P; hs.textContent="TRACE 8841-TX · LIVE TRANSFER";
    setState('DELIVERED',false); metric(1);
    chips.forEach(function(c,i){c.classList.add('in'); if(i===3)c.classList.add('hot');});
    leds.forEach(function(d){d.classList.add('in');});
    mEls.forEach(function(m){m.classList.add('hit');}); lEls.forEach(function(l){l.classList.add('hit');});
    fill.style.width='100%'; pin.style.left='100%'; play.textContent='43.000';
    msEl.textContent='0043'; drawTicks(0);
  }

  var raf=0, cycle=0;
  function loop(now){
    raf=requestAnimationFrame(loop);
    var e=now-t0;

    // rail counter: real elapsed ms of the current trace cycle
    var traceT=Math.min(e, SPAN+2200);
    msEl.textContent=String(Math.floor(Math.min(e,99999)/10)%10000).padStart(4,'0');
    drawTicks(e*0.06);

    // phases: 0-700 ring, 700-1400 handshake, then type + timeline
    if(e<700){ if(phase!==1){phase=1; setState('RINGING',true); hs.textContent='● INBOUND · TX';} }
    else if(e<1400){ if(phase!==2){phase=2; setState('HANDSHAKE',true); hs.textContent='HANDSHAKE · 340ms';} }
    else if(phase<3){ phase=3; setState('CONNECTED',true); hs.textContent='TRACE 8841-TX · LIVE TRANSFER'; }

    if(phase>=3){
      if(now-lastType>26){
        lastType=now;
        if(typed1<H.length){ typed1+=1; t1.textContent=H.slice(0,typed1); }
        else if(typed2<P.length){ typed2+=2; t2.textContent=P.slice(0,typed2); }
      }
      // chips stagger
      var ct=e-1600;
      chips.forEach(function(c,i){ if(ct> i*110) c.classList.add('in'); });
      if(ct>800) chips[3].classList.add('hot');
      for(var li=0;li<leds.length;li++){ if(ct>900+li*420) leds[li].classList.add('in'); }

      // playhead: 4.6s to sweep the 43s trace
      var pt=(e-1500)/4600;
      if(pt>0){
        var p=Math.min(pt,1);
        var eased=p<1?1-Math.pow(1-p,1.6):1;
        var x=eased*100;
        fill.style.width=x+'%'; pin.style.left=x+'%';
        play.textContent=(tAt(x)/1000).toFixed(3);
        metric(Math.min(1,p*1.15));
        for(var i=0;i<STEPS.length;i++){
          if(x>=STEPS[i].p-0.01){ mEls[i].classList.add('hit'); lEls[i].classList.add('hit'); }
        }
        if(p>=1 && stateEl.textContent!=='DELIVERED') setState('DELIVERED',false);
      }
    }

    // loop the trace every ~13s
    if(e>13000){
      cycle++; t0=now; phase=0; typed1=0; typed2=0;
      t1.textContent=''; t2.textContent='';
      mEls.forEach(function(m){m.classList.remove('hit');});
      lEls.forEach(function(l){l.classList.remove('hit');});
      chips.forEach(function(c){c.classList.remove('in','hot');});
      leds.forEach(function(d){d.classList.remove('in');});
      fill.style.width='0'; pin.style.left='0'; play.textContent='00.000';
      metric(0);
      var st=['TX','CA','FL','AZ','OH'][cycle%5];
      STEPS.st=st;
    }
  }

  var ro=('ResizeObserver' in window)?new ResizeObserver(function(){size(); if(reduce)drawTicks(0);}):null;
  if(ro)ro.observe(cv); else addEventListener('resize',size);

  requestAnimationFrame(function(){
    size();
    if(reduce){ finish(); return; }
    var io=new IntersectionObserver(function(en){
      if(en[0].isIntersecting){ if(!raf){ t0=performance.now(); raf=requestAnimationFrame(loop);} }
      else if(raf){ cancelAnimationFrame(raf); raf=0; }
    },{threshold:0});
    io.observe(root);
  });
})();
</script>
</section>
