<section class="stage w8">
  <canvas class="film" aria-hidden="true"></canvas>
  <div class="vig" aria-hidden="true"></div>

  <div class="ui">
    <header class="nav">
      <span class="mark">ALTARIOUS<i>&nbsp;GLOBAL</i></span>
      <nav class="links"><span class="on">Work</span><span>Verticals</span><span>Products</span><span>Contact</span></nav>
      <span class="cta">Get leads</span>
    </header>

    <div class="bars" aria-hidden="true">
      <div class="bar"><i></i></div><div class="bar"><i></i></div><div class="bar"><i></i></div>
    </div>

    <div class="mid">
      <p class="eyebrow" id="w8eye">Home Services — Live Transfers</p>
      <h1 class="hero" id="w8hero">Acquire<br><em>high-intent</em> customers.</h1>
      <p class="sub" id="w8sub">A burst pipe does not wait for a form submission.</p>
    </div>

    <footer class="strip">
      <span class="tc" id="w8tc">06:14</span>
      <span class="cap" id="w8cap">a burst pipe in Dayton, Ohio</span>
      <span class="meta" id="w8meta">Inbound Calls · Live Transfers · Web Leads</span>
    </footer>
  </div>

<style>
.w8{height:420px;position:relative;overflow:hidden;border-radius:10px;width:100%;
  background:#0b1016;color:#f2ece2;font-family:"IBM Plex Sans",system-ui,sans-serif;
  contain:content;isolation:isolate;}
.w8 *{box-sizing:border-box;margin:0;padding:0;}
.w8 .film{position:absolute;inset:0;width:100%;height:100%;display:block;}
.w8 .vig{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(115% 78% at 50% 42%,transparent 38%,rgba(4,8,12,.55) 78%,rgba(3,6,9,.9) 100%),
    linear-gradient(180deg,rgba(4,8,12,.62) 0%,transparent 26%,transparent 52%,rgba(3,6,10,.86) 100%);}
.w8 .ui{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 20px 12px;}
.w8 .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;}
.w8 .mark{font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.6);}
.w8 .mark i{font-style:normal;opacity:.6;}
.w8 .links{display:flex;gap:13px;color:rgba(242,236,226,.62);}
.w8 .links .on{color:#f2ece2;}
.w8 .cta{border:1px solid rgba(242,236,226,.45);padding:4px 9px;border-radius:99px;
  color:#f2ece2;white-space:nowrap;}
.w8 .bars{display:flex;gap:5px;margin-top:11px;}
.w8 .bar{flex:1;height:2px;background:rgba(242,236,226,.22);overflow:hidden;border-radius:2px;}
.w8 .bar i{display:block;height:100%;width:0;background:#f2ece2;transform-origin:left;}
.w8 .mid{margin-top:auto;margin-bottom:14px;max-width:30ch;}
.w8 .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(242,236,226,.72);margin-bottom:9px;}
.w8 .hero{font-family:"Instrument Serif","Times New Roman",serif;font-weight:400;
  font-size:44px;line-height:.96;letter-spacing:-.015em;text-shadow:0 2px 22px rgba(0,0,0,.55);}
.w8 .hero em{font-style:italic;opacity:.86;}
.w8 .sub{margin-top:9px;font-size:11px;line-height:1.45;color:rgba(242,236,226,.78);max-width:32ch;}
.w8 .strip{display:flex;align-items:center;gap:10px;padding-top:9px;
  border-top:1px solid rgba(242,236,226,.2);
  font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.09em;}
.w8 .tc{font-weight:600;}
.w8 .cap{color:rgba(242,236,226,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.w8 .meta{margin-left:auto;color:rgba(242,236,226,.5);white-space:nowrap;letter-spacing:.14em;
  text-transform:uppercase;font-size:8px;}
.w8 .fade{transition:opacity .5s ease,transform .5s ease;}
.w8 .out{opacity:0;transform:translateY(6px);}
@media (max-width:560px){
  .w8 .links,.w8 .meta{display:none;}
  .w8 .hero{font-size:32px;}
  .w8 .sub{font-size:10px;}
}
@media (prefers-reduced-motion:reduce){.w8 .fade{transition:none;}}
</style>

<script>
(function(){
  var cs=document.currentScript;
  var root=cs?cs.closest('.w8'):null;
  if(!root){var a=document.querySelectorAll('.stage.w8');root=a[a.length-1];}
  if(!root||root.dataset.init)return;root.dataset.init='1';

  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv=root.querySelector('.film'),ctx=cv.getContext('2d',{alpha:false});
  var bars=[].slice.call(root.querySelectorAll('.bar i'));
  var elEye=root.querySelector('#w8eye'),elHero=root.querySelector('#w8hero'),
      elSub=root.querySelector('#w8sub'),elTc=root.querySelector('#w8tc'),
      elCap=root.querySelector('#w8cap');
  [elEye,elHero,elSub,elTc,elCap].forEach(function(e){e.classList.add('fade');});

  var W=0,H=0,DPR=1;

  /* ============ duotone palettes (shadow -> highlight) ============ */
  var STORIES=[
    {key:'hs',eye:'Home Services — Live Transfers',
     hero:'Acquire<br><em>high-intent</em> customers.',
     sub:'A burst pipe does not wait for a form submission.',
     tc:'06:14',cap:'a burst pipe in Dayton, Ohio',
     dark:[10,17,26],light:[248,214,140],scene:'plumber'},
    {key:'ins',eye:'Insurance — Inbound Calls',
     hero:'Reach them<br>at the <em>kitchen table.</em>',
     sub:'Medicare and auto shoppers, on the phone, already decided to switch.',
     tc:'07:02',cap:'open enrollment, a kitchen table in Tulsa',
     dark:[16,12,26],light:[240,168,150],scene:'table'},
    {key:'wl',eye:'Web Leads — Verified Intent',
     hero:'Every lead is<br>a <em>person calling.</em>',
     sub:'Personal loans, legal, pest control, HVAC — routed in under nine seconds.',
     tc:'09:41',cap:'the transfer desk, 41 seconds to connect',
     dark:[6,20,24],light:[150,232,214],scene:'desk'}
  ];

  /* ============ scene painters (grayscale luminance) ============ */
  function bg(c,w,h,a,b){
    var g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,a);g.addColorStop(1,b);
    c.fillStyle=g;c.fillRect(0,0,w,h);
  }
  function blob(c,pts,fill){
    c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);
    c.closePath();c.fillStyle=fill;c.fill();
  }
  function glow(c,x,y,r,i){
    var g=c.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,'+i+')');g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.284);c.fill();
  }

  /* plumber under a sink: cabinet frame, pipes, torso, work-lamp */
  function scenePlumber(c,w,h,t){
    bg(c,w,h,'#3a3a3a','#080808');
    glow(c,w*0.70,h*0.34,w*0.46,0.55);
    /* cabinet interior box */
    c.fillStyle='#101010';c.fillRect(w*0.16,0,w*0.70,h*0.62);
    glow(c,w*0.68,h*0.30,w*0.30,0.42);
    /* pipe run */
    c.strokeStyle='#cfcfcf';c.lineWidth=Math.max(6,w*0.017);c.lineCap='round';
    c.beginPath();
    c.moveTo(w*0.60,-10);c.lineTo(w*0.60,h*0.26);
    c.quadraticCurveTo(w*0.60,h*0.36,w*0.70,h*0.36);
    c.lineTo(w*0.86,h*0.36);
    c.stroke();
    c.strokeStyle='#8f8f8f';c.lineWidth=Math.max(4,w*0.011);
    c.beginPath();c.moveTo(w*0.44,h*0.10);c.lineTo(w*0.44,h*0.30);c.lineTo(w*0.58,h*0.30);c.stroke();
    /* drip */
    var dy=(t*0.00045)%1;
    c.fillStyle='rgba(255,255,255,'+(0.85*(1-dy))+')';
    c.beginPath();c.ellipse(w*0.63,h*0.38+dy*h*0.22,2.4,4.2,0,0,6.284);c.fill();
    /* torso silhouette lying, head to right */
    blob(c,[[w*-0.05,h*1.05],[w*0.02,h*0.66],[w*0.22,h*0.56],[w*0.46,h*0.52],
            [w*0.58,h*0.55],[w*0.62,h*0.66],[w*0.50,h*0.80],[w*0.30,h*0.92],[w*0.10,h*1.05]],'#050505');
    /* head/shoulder highlight rim */
    c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;
    c.beginPath();c.moveTo(w*0.22,h*0.565);c.lineTo(w*0.46,h*0.525);c.stroke();
    /* raised arm reaching pipe */
    c.strokeStyle='#0a0a0a';c.lineWidth=Math.max(12,w*0.032);
    c.beginPath();c.moveTo(w*0.42,h*0.56);c.quadraticCurveTo(w*0.54,h*0.44,w*0.60,h*0.33);c.stroke();
    c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=1.5;
    c.beginPath();c.moveTo(w*0.44,h*0.54);c.quadraticCurveTo(w*0.55,h*0.43,w*0.605,h*0.325);c.stroke();
    /* floor */
    blob(c,[[0,h*0.96],[w,h*0.90],[w,h],[0,h]],'#020202');
  }

  /* kitchen table at dawn: window light, table edge, mug, seated figure */
  function sceneTable(c,w,h,t){
    bg(c,w,h,'#1d1d1d','#050505');
    /* window */
    var wx=w*0.52,wy=h*0.04,ww=w*0.40,wh=h*0.46;
    var g=c.createLinearGradient(wx,wy,wx,wy+wh);
    g.addColorStop(0,'#ffffff');g.addColorStop(.55,'#c8c8c8');g.addColorStop(1,'#5a5a5a');
    c.fillStyle=g;c.fillRect(wx,wy,ww,wh);
    c.strokeStyle='#050505';c.lineWidth=Math.max(4,w*0.010);
    c.beginPath();c.moveTo(wx+ww/2,wy);c.lineTo(wx+ww/2,wy+wh);
    c.moveTo(wx,wy+wh*0.52);c.lineTo(wx+ww,wy+wh*0.52);c.stroke();
    c.strokeRect(wx,wy,ww,wh);
    /* light shaft */
    c.save();c.globalCompositeOperation='lighter';
    var sg=c.createLinearGradient(wx,wy+wh,wx-w*0.18,h);
    sg.addColorStop(0,'rgba(255,255,255,.30)');sg.addColorStop(1,'rgba(255,255,255,0)');
    blob(c,[[wx,wy+wh],[wx+ww,wy+wh],[wx+ww*0.5,h],[wx-w*0.30,h]],sg);
    c.restore();
    /* seated figure silhouette, left */
    blob(c,[[w*0.06,h*0.72],[w*0.10,h*0.46],[w*0.17,h*0.38],[w*0.26,h*0.42],
            [w*0.30,h*0.56],[w*0.34,h*0.72]],'#040404');
    c.fillStyle='#040404';c.beginPath();c.arc(w*0.195,h*0.315,h*0.075,0,6.284);c.fill();
    c.strokeStyle='rgba(255,255,255,.42)';c.lineWidth=2;
    c.beginPath();c.arc(w*0.195,h*0.315,h*0.075,-1.1,0.5);c.stroke();
    /* table */
    var ty=h*0.72;
    var tg=c.createLinearGradient(0,ty,0,h);
    tg.addColorStop(0,'#9a9a9a');tg.addColorStop(.15,'#3a3a3a');tg.addColorStop(1,'#0a0a0a');
    c.fillStyle=tg;c.fillRect(0,ty,w,h-ty);
    c.fillStyle='rgba(255,255,255,.5)';c.fillRect(0,ty,w,1.5);
    /* mug + steam */
    c.fillStyle='#0b0b0b';c.beginPath();
    c.moveTo(w*0.40,ty-h*0.075);c.lineTo(w*0.475,ty-h*0.075);
    c.lineTo(w*0.468,ty);c.lineTo(w*0.407,ty);c.closePath();c.fill();
    c.strokeStyle='#0b0b0b';c.lineWidth=Math.max(3,w*0.007);
    c.beginPath();c.arc(w*0.482,ty-h*0.045,h*0.022,-1.3,1.3);c.stroke();
    c.strokeStyle='rgba(255,255,255,.30)';c.lineWidth=1.6;
    for(var i=0;i<2;i++){
      var ph=t*0.0011+i*2.1;
      c.beginPath();
      for(var k=0;k<=10;k++){
        var yy=ty-h*0.078-k*h*0.012, xx=w*0.425+i*w*0.022+Math.sin(ph+k*0.55)*(3+k*0.7);
        k?c.lineTo(xx,yy):c.moveTo(xx,yy);
      }
      c.globalAlpha=.55;c.stroke();c.globalAlpha=1;
    }
    /* papers on table */
    c.fillStyle='rgba(255,255,255,.62)';
    c.save();c.translate(w*0.62,ty+h*0.05);c.rotate(-0.09);
    c.fillRect(0,0,w*0.20,h*0.09);c.restore();
  }

  /* call desk: headset operator, monitors, ceiling lights, depth rows */
  function sceneDesk(c,w,h,t){
    bg(c,w,h,'#151515','#030303');
    /* back wall lights */
    for(var i=0;i<4;i++)glow(c,w*(0.14+i*0.24),h*0.12,w*0.13,0.30);
    /* far desk rows */
    for(var r=0;r<3;r++){
      var s=1-r*0.22,yy=h*(0.34+r*0.055),al=0.16+r*0.10;
      c.fillStyle='rgba(255,255,255,'+al+')';
      for(var j=0;j<4;j++){
        var x=w*(0.10+j*0.24)+r*w*0.03;
        c.beginPath();c.arc(x,yy,h*0.030*s,0,6.284);c.fill();
        c.fillRect(x-h*0.038*s,yy+h*0.026*s,h*0.076*s,h*0.055*s);
      }
    }
    /* monitor glow */
    glow(c,w*0.66,h*0.60,w*0.32,0.42);
    /* monitor */
    c.save();c.translate(w*0.58,h*0.46);
    var mg=c.createLinearGradient(0,0,0,h*0.26);
    mg.addColorStop(0,'#f2f2f2');mg.addColorStop(1,'#8d8d8d');
    c.fillStyle=mg;c.fillRect(0,0,w*0.30,h*0.26);
    c.fillStyle='rgba(0,0,0,.55)';
    for(var l=0;l<5;l++)c.fillRect(w*0.02,h*0.03+l*h*0.042,w*0.26*(0.9-l*0.13),h*0.016);
    /* live pulse bar */
    var p=(Math.sin(t*0.0022)*0.5+0.5);
    c.fillStyle='rgba(0,0,0,.8)';c.fillRect(w*0.02,h*0.225,w*0.26*p,h*0.014);
    c.restore();
    /* foreground operator, back of head + headset */
    blob(c,[[w*0.02,h*1.02],[w*0.06,h*0.72],[w*0.20,h*0.60],[w*0.40,h*0.62],
            [w*0.50,h*0.76],[w*0.52,h*1.02]],'#020202');
    c.fillStyle='#020202';c.beginPath();c.arc(w*0.27,h*0.50,h*0.115,0,6.284);c.fill();
    /* headset band + mic */
    c.strokeStyle='rgba(255,255,255,.62)';c.lineWidth=Math.max(3,w*0.008);
    c.beginPath();c.arc(w*0.27,h*0.50,h*0.128,Math.PI*1.08,Math.PI*1.92);c.stroke();
    c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.45)';
    c.beginPath();c.moveTo(w*0.355,h*0.545);c.quadraticCurveTo(w*0.38,h*0.61,w*0.335,h*0.635);c.stroke();
    /* rim light on shoulder */
    c.strokeStyle='rgba(255,255,255,.34)';c.lineWidth=2.2;
    c.beginPath();c.moveTo(w*0.20,h*0.605);c.lineTo(w*0.40,h*0.625);c.stroke();
    /* desk edge */
    c.fillStyle='#010101';c.fillRect(0,h*0.86,w,h*0.14);
    c.fillStyle='rgba(255,255,255,.22)';c.fillRect(0,h*0.86,w,1.5);
  }

  var PAINT={plumber:scenePlumber,table:sceneTable,desk:sceneDesk};

  /* ============ offscreen render + duotone LUT ============ */
  var oc=document.createElement('canvas'),octx=oc.getContext('2d',{alpha:false});
  var luts=STORIES.map(function(s){
    var lut=new Uint8Array(768);
    for(var i=0;i<256;i++){
      var k=i/255, e=k*k*(3-2*k); /* filmic S-curve */
      e=Math.min(1,Math.max(0,e*1.06-0.02));
      lut[i*3]=s.dark[0]+(s.light[0]-s.dark[0])*e;
      lut[i*3+1]=s.dark[1]+(s.light[1]-s.dark[1])*e;
      lut[i*3+2]=s.dark[2]+(s.light[2]-s.dark[2])*e;
    }
    return lut;
  });

  var frameData=null;
  function renderComposite(t,idxA,idxB,mix){
    var w=oc.width,h=oc.height;
    PAINT[STORIES[idxA].scene](octx,w,h,t);
    var A=octx.getImageData(0,0,w,h),a=A.data;
    var b=null;
    if(mix>0.001){
      PAINT[STORIES[idxB].scene](octx,w,h,t);
      b=octx.getImageData(0,0,w,h).data;
    }
    var la=luts[idxA],lb=luts[idxB];
    if(!frameData||frameData.width!==w||frameData.height!==h)
      frameData=octx.createImageData(w,h);
    var o=frameData.data,n=w*h;
    /* film dissolve: per-pixel threshold with soft edge, weighted by luminance */
    var soft=0.34, m=mix;
    for(var i=0,p=0;i<n;i++,p+=4){
      var ya=(a[p]*0.30+a[p+1]*0.59+a[p+2]*0.11)|0;
      if(!b){ var q=ya*3; o[p]=la[q];o[p+1]=la[q+1];o[p+2]=la[q+2];o[p+3]=255; continue; }
      var yb=(b[p]*0.30+b[p+1]*0.59+b[p+2]*0.11)|0;
      /* brighter areas of the incoming frame burn in first (like film) */
      var bias=(yb/255-0.5)*0.30;
      var f=(m*(1+soft*2)-soft) + bias;
      f=f<0?0:f>1?1:f;
      var qa=ya*3,qb=yb*3,g=1-f;
      /* bloom on the seam */
      var seam=1+1.35*f*g;
      var r=(la[qa]*g+lb[qb]*f)*seam,
          gg=(la[qa+1]*g+lb[qb+1]*f)*seam,
          bb=(la[qa+2]*g+lb[qb+2]*f)*seam;
      o[p]=r>255?255:r;o[p+1]=gg>255?255:gg;o[p+2]=bb>255?255:bb;o[p+3]=255;
    }
    return frameData;
  }

  /* moving grain, drawn on the main canvas after the upscale */
  var gc=document.createElement('canvas'),gctx=gc.getContext('2d');
  var GT=[];
  function buildGrain(){
    gc.width=gc.height=180;
    GT.length=0;
    for(var k=0;k<4;k++){
      var im=gctx.createImageData(180,180),d=im.data;
      for(var i=0;i<d.length;i+=4){
        var v=(Math.random()*255)|0;
        d[i]=d[i+1]=d[i+2]=v;d[i+3]=26;
      }
      gctx.putImageData(im,0,0);
      var cnv=document.createElement('canvas');cnv.width=cnv.height=180;
      cnv.getContext('2d').drawImage(gc,0,0);
      GT.push(cnv);
    }
  }
  buildGrain();

  function resize(){
    var r=root.getBoundingClientRect();
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(1,Math.round(r.width));H=420;
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    cv.style.width=W+'px';cv.style.height=H+'px';
    /* offscreen at reduced res — duotone runs per pixel, keep it cheap */
    var ow=Math.min(360,Math.max(180,Math.round(W*0.55)));
    oc.width=ow;oc.height=Math.round(ow*H/W);
    frameData=null;
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  }

  var tmp=document.createElement('canvas'),tctx=tmp.getContext('2d');
  function blit(img){
    if(tmp.width!==oc.width||tmp.height!==oc.height){tmp.width=oc.width;tmp.height=oc.height;}
    tctx.putImageData(img,0,0);
    ctx.drawImage(tmp,0,0,cv.width,cv.height);
  }

  /* ============ sequencing ============ */
  var DUR=5200, XF=1100, idx=0, phase=0, playing=true;
  function setText(i,fade){
    var s=STORIES[i],els=[elEye,elHero,elSub,elTc,elCap];
    function put(){
      elEye.textContent=s.eye;elHero.innerHTML=s.hero;elSub.textContent=s.sub;
      elTc.textContent=s.tc;elCap.textContent=s.cap;
      els.forEach(function(e){e.classList.remove('out');});
    }
    if(fade&&!reduce){
      els.forEach(function(e){e.classList.add('out');});
      setTimeout(put,340);
    }else put();
  }

  var start=0,raf=0;
  function draw(t){
    if(!start)start=t;
    var e=t-start;
    var cycle=DUR+XF;
    var k=e%cycle, i=Math.floor(e/cycle)%3;
    var mix=k>DUR?((k-DUR)/XF):0;
    var nxt=(i+1)%3;
    if(i!==idx){idx=i;setText(i,true);}
    blit(renderComposite(t,i,nxt,mix));
    /* grain: two offset tiles, moving */
    ctx.save();ctx.globalCompositeOperation='overlay';
    var g1=GT[(t/50|0)%4],g2=GT[(t/37|0)%4];
    var s1=180*DPR*1.6;
    ctx.globalAlpha=.55;
    for(var y=-1;y*s1<cv.height+s1;y++)for(var x=-1;x*s1<cv.width+s1;x++)
      ctx.drawImage(g1,x*s1+((t*0.09)%s1),y*s1+((t*0.13)%s1),s1,s1);
    ctx.globalAlpha=.30;
    for(var y2=-1;y2*s1<cv.height+s1;y2++)for(var x2=-1;x2*s1<cv.width+s1;x2++)
      ctx.drawImage(g2,x2*s1-((t*0.17)%s1),y2*s1-((t*0.07)%s1),s1,s1);
    ctx.restore();
    /* gate weave / exposure flicker */
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,255,255,'+(0.012+0.010*Math.sin(t*0.021)).toFixed(4)+')';
    ctx.fillRect(0,0,cv.width,cv.height);ctx.restore();
    /* progress bars */
    for(var b=0;b<3;b++){
      var f=b<i?1:b>i?0:Math.min(1,k/DUR);
      bars[b].style.width=(f*100).toFixed(1)+'%';
      bars[b].style.opacity=b===i?1:.5;
    }
    raf=requestAnimationFrame(draw);
  }

  function still(){
    resize();setText(0,false);
    blit(renderComposite(0,0,1,0));
    ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.5;
    var s1=180*DPR*1.6;
    for(var y=-1;y*s1<cv.height+s1;y++)for(var x=-1;x*s1<cv.width+s1;x++)
      ctx.drawImage(GT[0],x*s1,y*s1,s1,s1);
    ctx.restore();
    bars[0].style.width='100%';bars[1].style.width='0';bars[2].style.width='0';
  }

  function startLoop(){if(!raf&&!reduce){start=0;raf=requestAnimationFrame(draw);}}
  function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0;}}

  var ro=null;
  if('ResizeObserver' in window){
    ro=new ResizeObserver(function(){var pw=W;resize();if(reduce||!raf)still();});
    ro.observe(root);
  }else window.addEventListener('resize',function(){resize();if(reduce||!raf)still();});

  resize();
  if(reduce){still();}
  else{
    still();
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(es){es[0].isIntersecting?startLoop():stopLoop();},{threshold:.05}).observe(root);
    }else startLoop();
  }
})();
</script>
